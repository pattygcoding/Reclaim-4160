<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Reclaim-4160</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0d0f1a; overflow: hidden; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; color: #e7ecff;
    }
    h1 { font-size: 15px; letter-spacing: 3px; opacity: .65; margin: 0 0 10px; user-select: none; }
    canvas {
      border-radius: 14px; box-shadow: 0 16px 50px rgba(0,0,0,.55);
      max-width: 96vw; max-height: 78vh; outline: none; touch-action: none;
    }
    #status { font-size: 12px; opacity: .6; margin-top: 10px; min-height: 1em; user-select: none; }
  </style>
</head>
<body>
  <h1>RECLAIM&nbsp;4160</h1>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">Loading&hellip;</div>

  <script>
    const statusEl = document.getElementById('status');
    const canvas = document.getElementById('canvas');
    // Click/tap the canvas to grab keyboard focus so the game receives input.
    canvas.addEventListener('pointerdown', () => canvas.focus());

    var Module = {
      canvas,
      print: (t) => { if (t) console.log(t); },
      printErr: (t) => { if (t) console.warn(t); },
      setStatus: (t) => {
        statusEl.textContent = t || '';
        if (!t) statusEl.textContent = 'A/D move  ·  Space jump  ·  Esc pause';
      },
      onRuntimeInitialized() {
        statusEl.textContent = 'A/D move  ·  Space jump  ·  Esc pause';
        canvas.focus();
      },
    };
  </script>

  {{{ SCRIPT }}}
</body>
</html>
